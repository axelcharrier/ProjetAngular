<div>
    <form [formGroup]="studentForm" (ngSubmit)="submitStudent()">
        <div class="flex flex-wrap items-end gap-4 m-5">
            <p-floatlabel>
                <p-inputnumber id="id" formControlName="id" required />
                <label for="number" aria-label="Id">Id</label>
            </p-floatlabel>

            <p-floatlabel>
                <input pInputText id="last-name" formControlName="nom" required />
                <label p-floatlabel for="last-name" aria-label="last-name">Nom</label>
            </p-floatlabel>
                
            <p-floatlabel>
                <input pInputText id="first-name" formControlName="prenom" required />
                <label for="first-name" aria-label="first-name">Prénom</label>
            </p-floatlabel>

            <button pButton type="submit" class="primary" [disabled]="buttonIsDisabled()" >Créer</button>
        </div>
    </form>

    <p-table [value]="utilisateurs()" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th>Id</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Actions</th>
            </tr>
        </ng-template>
        <ng-template #body let-utilisateur>
            <tr>
                <td>{{ utilisateur.id }}</td>
                <td>{{ utilisateur.nom }}</td>
                <td>{{ utilisateur.prenom }}</td>
                <td>
                    <p-button label="Supprimer" (onClick)="removeStudent(utilisateur.id)" />
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
