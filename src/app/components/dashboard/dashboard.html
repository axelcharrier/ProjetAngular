<div>
    <div class="m-2 flex justify-between">
        <div>
        <h2 i18n >Add a student</h2>
        <form (submit)="handleSubmit($event)">
            <div class="flex flex-wrap items-end gap-5 m-5">
                <ng-container
                [tanstackField]="form"
                name="firstName"
                #firstName="field"
                >
                    <p-floatLabel>
                        <input pInputText
                            [name]="firstName.api.name"
                            [value]="firstName.api.state.value"
                            (blur)="firstName.api.handleBlur()"
                            (input)="firstName.api.handleChange($any($event).target.value)"
                        />
                        <label [for]="firstName.api.name" i18n>First name</label>
                    </p-floatLabel>
                </ng-container>

                <ng-container
                [tanstackField]="form"
                name="lastName"
                #lastName="field"
                >
                    <p-floatLabel>
                        <label [for]="lastName.api.name" i18n>Last name</label>
                        <input pInputText
                            [name]="lastName.api.name"
                            [value]="lastName.api.state.value"
                            (blur)="lastName.api.handleBlur()"
                            (input)="lastName.api.handleChange($any($event).target.value)"
                        />
                    </p-floatLabel>
                </ng-container>
                <button pButton type="submit" class="primary" i18n >Create</button>
            </div>
        </form>
        </div>
        <div class="flex flex-wrap items-end gap-4 m-5">
            <p-floatlabel>
                <input pInputText name="filter" #filter>
                <label for="filter" i18n >Search by first name</label>
            </p-floatlabel>
            <button pButton type="button" class="primary" (click)="filterResults(filter.value)" i18n>Search</button>
        </div>
    </div>

    <p-table [value]="filteredStudents()" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th i18n >Last name</th>
                <th i18n >First name</th>
                <th i18n >Actions</th>
            </tr>
        </ng-template>
        <ng-template #body let-user>
            <tr>
                <td>{{ user.lastName }}</td>
                <td>{{ user.firstName }}</td>
                <td class="flex flex-wrap items-end gap-4">
                    <p-button i18n-label severity="danger" label="Delete" (click)="removeStudent(user.id)" />
                    <p-button i18n-label label="Update" severity="info" (click)="toUpdatePage(user.id)" />
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
