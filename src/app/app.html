<main class="max-h-screen grid-rows-3">
  <section class="h-[10vh]">
    <header>
      <div class="flex flex-row justify-between items-center">
        <h1 i18n class="p-1">Student management</h1>
      </div>
    </header>
  </section>
  <p-toast />
  <router-outlet />
  <footer class="h-[10vh]">
    @if (this.userServices.user?.()) {
      <div class="flex flex-col justify-end items-end">
        <p>Connected as {{ this.userServices.user?.() }}</p>
        <button class="p-button p-button-secondary" (click)="logout()" i18n>Logout</button>
      </div>
    }
  </footer>
</main>
