name: Develop Pipeline

#Permission minimale
permissions:
  contents: read

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  NODE_VERSION: '20' 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6
      - uses: actions/setup-node@6
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Installation de pnpm
        run: wget -qO- https://get.pnpm.io/install.sh | sh -
          
      - name: Installation des dépendances
        run: pnpm install

      - name: lancement des tests
        run: ng test
