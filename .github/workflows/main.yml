name: Develop Pipeline

#Permission minimale
permissions:
  contents: read

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Apt Update
        run: sudo apt-get update

      - name: Apt install
        run: sudo apt-get install nodejs npm

      - name: Install pnpm
        run: sudo npm install -g pnpm

      - name: Installing package
        run: pnpm i
